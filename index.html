#dailyPage,#overlay .modal{touch-action:pan-y}#overlay{z-index:30}.navcard thead{position:sticky;top:0;background:white}</style><style>body:before{display:none}#fixedPhoto{position:fixed;top:0;left:0;width:100%;height:100vh;background-image:var(--bgimg);background-size:cover;background-position:center;pointer-events:none;z-index:-1;transform:translateZ(0)}body{isolation:isolate}#calendar .scroll{overscroll-behavior-x:contain}#fixedPhoto{height:100lvh}</style></head><body><div id="authGate" style="position:fixed;inset:0;z-index:99999;background:#fff6fa;padding:24px;overflow:auto;font-family:sans-serif"><div style="max-width:420px;margin:8vh auto"><h1>🐾 반려동물 건강관리</h1><p>개인 계정으로 로그인하세요.</p><input id="authEmail" type="email" placeholder="이메일" style="width:100%;margin:8px 0"><input id="authPass" type="password" placeholder="비밀번호 (6자 이상)" style="width:100%;margin:8px 0"><button id="loginBtn">로그인</button> <button id="signupBtn">회원가입</button><p id="authMsg" role="status"></p></div></div><div id="cloudBar" style="position:sticky;top:0;z-index:25;background:#fff;padding:8px;display:none;font:13px sans-serif"><span id="cloudStatus"></span> <button id="syncBtn">동기화</button> <button id="nameBtn">아이 이름</button> <button id="logoutBtn">로그아웃</button></div><div id="fixedPhoto" aria-hidden="true"></div><div class="wrap"><header class="top"><button id="menuToggle" aria-label="메뉴 열기" onclick="toggleMenu(true)">☰</button><div><h1>🐶 반려동물의 일상 🌼</h1><div class="small">맘마 · 약 · 수액 · 건강기록</div></div><div class="toolbar"><button onclick="showSettings()">⚙️ 설정</button><button onclick="exportData()">백업</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div></header><div class="panel"><div class="monthbar"><button onclick="shiftMonth(-1)">‹</button><strong id="monthTitle"></strong><button onclick="shiftMonth(1)">›</button></div><div class="toolbar" style="justify-content:center;margin-bottom:12px"><button id="viewSimple" onclick="setView('simple')">간단 달력</button><button id="viewFull" onclick="setView('full')">한눈에 기록표</button></div><div id="monthWater" class="small" style="text-align:center;margin-bottom:8px"></div><div id="monthlyStats" class="summary"></div><div class="toolbar" style="margin-bottom:10px"></div><div id="activeManufacture" class="live-total" style="margin-bottom:10px"></div><div id="calendar"></div></div><div class="panel"><div class="sectionhead"><h2>🛍️ 구매 목록</h2><button class="mini" onclick="showSettings('links')">편집</button></div><div id="quickLinks" class="links"></div></div><div class="foot">저장 상태를 확인하고 주기적으로 백업 파일을 보관해 주세요.</div></div><div id="sideShade" onclick="toggleMenu(false)"></div><nav id="sideMenu" aria-label="반려동물의 일상 메뉴"><h2>🐾 반려동물의 일상 <button style="display:inline;width:auto;float:right;padding:5px 9px;margin:0" onclick="toggleMenu(false)">닫기 ✕</button></h2><button onclick="navHome()">🏠 홈 · 건강달력</button><button onclick="openDailyPage()">📊 일일기록 · 월간 비교</button><button onclick="navMedical()">🏥 의료기록</button><button onclick="visits21()">📋 병원별 수가표</button><button onclick="navExpense()">💰 가계부</button><button onclick="navLinks()">🛍️ 구매링크</button><button onclick="navCompare('all')">📊 월간 비교</button><button onclick="toggleMenu(false);showSettings()">⚙️ 설정 · 백업</button></nav><main id="dailyPage" class="wrap hidden"><header class="top"><button onclick="toggleMenu(true)">☰</button><h1>일일기록</h1><button onclick="navHome()">홈</button></header><div class="panel"><h2>월간 기록 비교</h2><div class="navgrid"><button onclick="navCompare('food')">🥣 맘마</button><button onclick="navCompare('toilet')">💩 응가</button><button onclick="navCompare('water')">🥤 음수량</button><button onclick="navCompare('weight')">⚖️ 체중</button></div></div></main><div id="overlay" class="overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const KEY='kongicare_v4';const groups={food:'맘마',snack:'간식',supp:'영양제',med:'매일 먹는 약',other:'기타약',fluid:'피하수액 종류',supply:'주사기·소모품'};const defaults={food:[],snack:[],supp:[],med:[],other:[],fluid:[],supply:[]};function initial(){return {catalog:structuredClone(defaults),links:[],days:{},font:'Jua',opacity:96,dayOpacity:86,bg:'',view:'simple'}}let state=initial();state.catalog={...structuredClone(defaults),...(state.catalog||{})};state.links||=[];state.days||={};state.moisture||={};state.calories||={};state.doseRules||={};state.compoundRules||={};state.doseDefaults||={};state.gallbladder||={ingredients:[{name:"",rate:0,whole:"",active:""},{name:"",rate:0,whole:"",active:""}],history:[],packets:0};let monthDirection=0;let current=new Date();current.setDate(1);let selected='';let activeTab='catalog';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){window.petSave?.()}function applyTheme(){document.documentElement.style.setProperty('--font',"'"+(state.font||'Jua')+"',sans-serif");document.documentElement.style.setProperty('--opacity',String((state.opacity??96)/100));document.documentElement.style.setProperty('--day-opacity',String((state.dayOpacity??86)/100));document.documentElement.style.setProperty('--bgimg',state.bg?`url(${JSON.stringify(state.bg)})`:'none')}function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function dayData(k){return state.days[k]||{}}function getDay(k){return state.days[k]??(state.days[k]={meals:[],snacks:[],supp:{},med:{},other:[],fluid:[],poop:[],walk:0,water:'',hospital:false,appointment:'',comment:'',files:[]})}function timeObj(){return {h:7}}function timeUI(t,path){t=t||timeObj();let h=Number(t.h??7);if(t.ap==='오후'&&h<12)h+=12;if(t.ap==='오전'&&h===12)h=0;return `<select class="hourpick" aria-label="시간" onchange="setPath('${path}.h',Number(this.value));setPath('${path}.ap','');"><option value="">시간</option>${Array.from({length:24},(_,i)=>`<option value="${i}" ${h===i?'selected':''}>${String(i).padStart(2,'0')}시</option>`).join('')}</select>`}function setPath(path,value){let parts=path.split('.');let obj=getDay(selected);for(let i=0;i<parts.length-1;i++){obj=obj[parts[i]]??(obj[parts[i]]={})}obj[parts.at(-1)]=value;save();renderCalendar()}function shiftMonth(n){current.setMonth(current.getMonth()+n);renderCalendar()}function setView(v){state.view=v;save();renderCalendar()}function totalMeals(d){return (d.meals||[]).reduce((s,x)=>s+(Number(x.g)||0),0)}
function mealWater(d){let sum=0,unknown=[];for(let x of (d.meals||[])){let g=Number(x.g)||0;if(g<=0)continue;let pct=Number(state.moisture?.[x.name]);if(state.moisture?.[x.name]!==undefined&&state.moisture[x.name]!==''&&pct>=0&&pct<=100)sum+=g*pct/100;else unknown.push(x.name||'미선택')}return {ml:sum,unknown:[...new Set(unknown)]}}

function foodKcal(d){let kcal=0,unknown=[];for(let x of d.meals||[]){let g=Number(x.g)||0;if(g<=0)continue;let v=state.calories[x.name];if(v!==undefined&&v!==''&&Number(v)>=0)kcal+=g*Number(v)/100;else unknown.push(x.name||'미선택')}return {kcal,unknown:[...new Set(unknown)]}}
function effectiveTiming(type,name){return state.doseDefaults?.[type+'|'+name]?.timing||state.defaultDoseTiming||'식간'}
function effectiveHour(type,name){return Number(state.doseDefaults?.[type+'|'+name]?.hour??7)}
function doseLabel(type,name){return '['+effectiveTiming(type,name)+'] '+name}
function weightFor(k){let d=dayData(k),w=Number(d.weight);return w>0?w:null}
function doseResult(type,name,k){let rule=state.doseRules[type+'|'+name];let w=weightFor(k);if(!rule||!w||!(Number(rule.rate)>0))return null;let total=w*Number(rule.rate);return {total,unit:rule.unit==='count'?'개':rule.unit==='spoon'?'스푼':'mg',w,rule}}
function compoundResult(name,k){let c=state.compoundRules[name],w=weightFor(k);if(!c||!w||!(Number(c.stock)>0)||!(Number(c.stockUnit)>0)||!(Number(c.target)>0))return null;let mg=w*Number(c.target),pieces=mg/(Number(c.stock)/Number(c.stockUnit));return {mg,pieces,w,c}}
function doseRuleUI(type,name){let key=type+'|'+name,rule=state.doseRules[key]||{};return `<div class="dose-single"><strong>${esc(name)}</strong><select aria-label="복용 시점" onchange="setDosePref('${type}','${escJS(name)}','timing',this.value)">${['식간','식전','식후'].map(t=>`<option ${effectiveTiming(type,name)===t?'selected':''}>${t}</option>`).join('')}</select><select aria-label="기본 시간" onchange="setDosePref('${type}','${escJS(name)}','hour',Number(this.value))">${Array.from({length:24},(_,i)=>`<option value="${i}" ${effectiveHour(type,name)===i?'selected':''}>${String(i).padStart(2,'0')}시</option>`).join('')}</select><input aria-label="체중당 용량" type="number" min="0" step="0.01" placeholder="용량" value="${esc(rule.rate??'')}" onchange="setRule('${type}','${escJS(name)}','rate',this.value)"><select aria-label="단위" onchange="setRule('${type}','${escJS(name)}','unit',this.value)">${[['mg','mg/kg'],['count','개/kg'],['spoon','스푼/kg']].map(([v,t])=>`<option value="${v}" ${((rule.unit||'mg')===v)?'selected':''}>${t}</option>`).join('')}</select></div>`}

function openDoseBoard(){let k=selected||dateKey(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());modal(`<div class="modalhead"><h2>💊 약 · 영양제 용량표</h2><button onclick="closeModal()">✕</button></div><p class="small">${k} · 체중 ${weightFor(k)??'미입력'}kg · 설정에 입력한 처방값으로 계산한 참고값</p>${['med','supp','other'].map(t=>`<h3 style="margin-top:15px">${groups[t]}</h3>${(state.catalog[t]||[]).map(n=>doseCard(t,n,k)).join('')}`).join('')}<p class="small">⚠️ 실제 투여량은 수의사 처방과 조제 지시를 확인하세요. 반올림·분할·조제 손실은 자동 판단하지 않아요.</p><button onclick="showSettings('doses')">용량 설정</button>`)}

function setCalories(name,value){if(value==='')delete state.calories[name];else if(Number(value)>=0)state.calories[name]=Number(value);save()}function setMoisture(name,value){if(value==='')delete state.moisture[name];else if(Number(value)>=0&&Number(value)<=100)state.moisture[name]=Number(value);else return alert('0~100 사이로 입력해 주세요');save()}function addCatalog(id){let name=prompt(`${groups[id]} 이름`);if(!name?.trim())return;name=name.trim();if(state.catalog[id].includes(name))return alert('이미 있는 이름이에요');state.catalog[id].push(name);save();renderSettings()}function renameCatalog(id,i){let old=state.catalog[id][i],name=prompt('새 이름',old);if(!name?.trim()||name.trim()===old)return;name=name.trim();if(state.catalog[id].includes(name))return alert('이미 있는 이름이에요');state.catalog[id][i]=name;if(id==='food'&&Object.prototype.hasOwnProperty.call(state.moisture,old)){state.moisture[name]=state.moisture[old];delete state.moisture[old]}if(id==='food'&&Object.prototype.hasOwnProperty.call(state.calories,old)){state.calories[name]=state.calories[old];delete state.calories[old]}if(['med','supp','other'].includes(id)){let key=id+'|'+old,nkey=id+'|'+name;if(state.doseDefaults[key]){state.doseDefaults[nkey]=state.doseDefaults[key];delete state.doseDefaults[key]}if(state.doseRules[key]){state.doseRules[nkey]=state.doseRules[key];delete state.doseRules[key]}if(state.compoundRules[old]){state.compoundRules[name]=state.compoundRules[old];delete state.compoundRules[old]}}let map={food:'meals',snack:'snacks',fluid:'fluid',other:'other'};for(let d of Object.values(state.days)){if(map[id])for(let x of d[map[id]]||[])if(x.name===old)x.name=name;if(id==='supp'||id==='med'){if(d[id]&&Object.prototype.hasOwnProperty.call(d[id],old)){d[id][name]=d[id][old];delete d[id][old]}}}for(let x of state.links)if(x.group===id&&x.name===old)x.name=name;save();renderSettings()}function deleteCatalog(id,i){let n=state.catalog[id][i];if(!confirm(`'${n}' 항목을 목록에서 삭제할까요? 과거 기록은 유지돼요.`))return;state.catalog[id].spli function openGallbladder(){let g=gb(),w=gbWeight(),p=Number(g.packets)||0,calcs=g.ingredients.map(x=>gbCalc(x,w,p));let valid=calcs.length>0&&calcs.every(x=>x.per!==null);modal(`<div class="modalhead"><h2>🧪 담낭약 제조 · 조제 이력</h2><button onclick="closeModal()">✕</button></div><p class="small">체중은 선택한 날짜의 기록을 사용해요. 현재 ${w||'미등록'}kg. 처방 확인 전 실제 조제에 사용하지 마세요.</p><div class="entry"><label>체중 kg <input id="gbWeightInput" type="number" min="0" step="0.01" value="${w||''}" style="width:85px" placeholder="체중"></label><button class="mini" onclick="let v=Number($('gbWeightInput').value);if(!(v>0))return alert('체중을 입력해 주세요');getDay(selected||dateKey(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())).weight=v;save();openGallbladder();renderCalendar()">체중 기록</button><label>봉투 수 <input type="number" min="1" step="1" value="${p}" style="width:75px" onchange="gb().packets=Math.max(1,Math.floor(Number(this.value)||1));save();openGallbladder()"></label></div>${g.ingredients.map((x,i)=>{let c=calcs[i];return `<div class="gb-row"><div class="entry"><input aria-label="성분 이름" value="${esc(x.name)}" onchange="gbSet(${i},'name',this.value)" style="flex:1;min-width:90px"><button class="mini danger" onclick="if(confirm('이 성분을 삭제할까요?')){gb().ingredients.splice(${i},1);save();openGallbladder()}">삭제</button></div><div class="gb-fields"><label>처방 mg/kg/회<input type="number" step="0.01" value="${esc(x.rate)}" onchange="gbSet(${i},'rate',this.value)"></label><label>정·캡슐 전체 무게 mg<input type="number" step="0.001" placeholder="실측 무게" value="${esc(x.whole)}" onchange="gbSet(${i},'whole',this.value)"></label><label>1정·캡슐 유효성분 mg<input type="number" step="0.001" placeholder="제품 함량" value="${esc(x.active)}" onchange="gbSet(${i},'active',this.value)"></label><div><div class="small">1회 유효성분</div><strong>${w&&Number(x.rate)>0?fmt(c.target)+'mg':'미입력'}</strong><div class="small">1봉 분말: ${c.per===null?'확인 필요':fmt(c.per)+'mg'}</div><div class="small">${p}봉 분말: ${c.all===null?'확인 필요':fmt(c.all)+' function formulationSummary(x){if(!x)return '미등록';if(x.ingredients?.length)return x.ingredients.map(z=>`${z.name}: ${z.per==null?'분말량 미등록':fmt(z.per)+'mg/봉'} (유효성분 ${z.target==null?'미등록':fmt(z.target)+'mg/봉'})`).join(' · ');return x.memo||'과거 수기 기록'}
function manufactureSection(k){let own=(gb().history||[]).filter(x=>x.date===k),last=lastManufacture(k);return `<div class="block wide"><div class="sectionhead"><h3>🧪 약 제조 기록</h3><button class="mini" onclick="openManufactureEditor('${k}')">+ 제조 기록</button></div><div class="small">${last?`마지막 제조 ${esc(last.date)} · ${esc(formulationSummary(last))}`:'이전 제조 기록 없음'}</div>${own.map(x=>`<div class="catalogrow"><span>${esc(x.date)} · ${esc(x.weight||'–')}kg · ${esc(x.packets||'–')}봉<br><span class="small">${esc(formulationSummary(x))}</span></span><span><button class="mini" onclick="editManufacture('${escJS(x.id)}')">수정</button><button class="mini danger" onclick="deleteManufacture('${escJS(x.id)}')">삭제</button></span></div>`).join('')}<p class="small">다음 제조일까지 최근 조제 이력이 표시됩니다. 처방 변경 시 기존 제조 기록은 유지돼요.</p></div>`}
function openManufactureEditor(k){selected=k;let g=gb(),w=Number(dayData(k).weight)||0,p=Number(g.packets)||90;let c=g.ingredients.map(x=>gbCalc(x,w,p));modal(`<div class="modalhead"><h2>🧪 ${esc(k)} 약 제조</h2><button onclick="openDay(selected)">✕ 돌아가기</button></div><p class="small">성분의 기본 정제 무게·유효성분 함량은 저장되어 다음 제조에도 적용돼요. 체중은 해당 날짜 기록에서 가져옵니다.</p><div class="entry"><label>체중 kg <input type="number" step="0.01" value="${w||''}" style="width:85px" onchange="getDay(selected).weight=this.value;save();openManufactureEditor(selected)"></label><label>제조 봉수 <input type="number" min="1" step="1" value="${p}" style="width:75px" onchange="gb().packets=Math.max(1,Math.floor(Number(this.value)||1));save();openManufactureEditor(selected)"></label></div>${g.ingredients.map((x,i)=>{let z=c[i],ratio=Number(x.active)>0&&Number(x.whole)>0?Number(x.whole)/Number(x.active):null;return `<div class="gb-row"><div class="entry"><strong style="flex:1">${esc(x.name)}</strong><button class="mini danger" onclick="if(confirm('성분을 기본 목록에서 삭제할까요?')){gb().ingredients.splice(${i},1);save();openManufactureEditor(selected)}">삭제</button></div><div class="gb-fields"><label>1회 기준 mg/kg<input type="number" step="0.01" value="${esc(x.rate)}" onchange="gbIngredient(${i},'rate',this.value)"></label><label>1정·캡슐 전체 무게 mg<input type="number" step="0.001" value="${esc(x.whole)}" placeholder="실측" onchange="gbIngredient(${i},'whole',this.value)"></label><label>1정·캡슐 유효성분 mg<input type="number" step="0.001" value="${esc(x.active)}" placeholder="제품 표시량" onchange="gbIngredient(${i},'active',this.value)"></label><div class="small">전체무게/유효성분 비율: ${ratio===null?'미등록':fmt(ratio)}<br>1봉 유효성분: ${w?fmt(z.target)+'mg':'체중 미입력'}<br>1봉 조제 분말: ${z.per===null?'미등록':fmt(z.per)+'mg'}<br>${p}봉 총 분말: ${z.all===null?'미등록':fmt(z.all)+'mg'}<br>정·캡슐 환산: ${z.all!==null&&Number(x.whole)>0?fmt(z.all/Number(x.whole))+'개':'미등록'}</div></div></div>`}).join('')}<div class="entry"><button class="mini" onclick="let name=prompt('성분 이름');if(name?.trim()){gb().ingredients.push({name:name.trim(),rate:'',whole:'',active:''});save();openManufactureEditor(selected)}">+ 성분 추가</button></div><div class="live-total">1봉 합산 분말: <b>${c.length&&c.every(z=>z.per!==null)?fmt(c.reduce((a,z)=>a+z.per,0))+'mg':'원료 정보 입력 필요'}</b></div><div class="entry"><button class="primary" onclick="gbSaveHistory()">이 날짜에 제조 기록 저장</button><button onclick="manualManufacture('${k}')">과거 수기 기록 입력</button></div><p class="small">⚠️ 유효성분 함량과 분말 전체 무게는 다릅니다. 계산값은 이론값이며 실제 분쇄·혼합의 균일성, 계량 오차, 처방 적합성은 수의사·조제 전문가 확인이 필요합니다.</p>`)}
function gbIngredient(i,key,value){let x=gb().ingredients[i];x[key]=value===''?'':Number(value);save();openManufactureEditor(selected)}
function manualManufacture(k){let weight=prompt('당시 체중 kg (모르면 비워두기)',String(dayData(k).weight||''));if(weight===null)return;let packets=prompt('제조 봉수 (모르면 비워두기)','');if(packets===null)return;let memo=prompt('수기 기록의 우루사·실리마린 실제 조제량과 정제 수를 원문대로 입력','');if(memo===null)return;gb().history.push({id:String(Date.now())+Math.random(),date:k,weight,packets,memo,manual:true});save();openDay(k);renderCalendar()}

if(which==='toilet'){let u=state.urine[selected]||{};content=`<div class="navcard"><h3>💧 쉬야</h3><div class="quickfield">횟수 <input type="number" min="0" step="1" value="${esc(u.count??'')}" placeholder="회" oninput="setUrine('count',this.value)">회</div><div class="quickfield">양 <select onchange="setUrine('amount',this.value)"><option value="">선택</option>${['적음','보통','많음'].map(v=>`<option ${u.amount===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="quickfield">실측량 <input type="number" min="0" step="1" value="${esc(u.ml??'')}" placeholder="선택사항" oninput="setUrine('ml',this.value)">ml</div></div><div class="navcard"><h3>💩 응가</h3><p>배변 횟수 ${d.poop?.length||0}회 · 상태별로 기록할 수 있어요.</p><button class="primary" onclick="openDay(selected)">배변 상태 기록하기</button></div>`}
if(which==='walk'){content=`<div class="navcard"><h3>🐾 산책</h3><div class="quickfield">횟수 <input type="number" min="0" step="1" value="${esc(d.walk??0)}" oninput="setPath('walk',Number(this.value))">회</div><div class="quickfield">총 시간 <input type="number" min="0" value="${esc(d.walkMinutes??'')}" oninput="setPath('walkMinutes',this.value)">분</div><div class="quickfield">거리 <input type="number" min="0" step="0.01" value="${esc(d.walkKm??'')}" oninput="setPath('walkKm',this.value)">km</div><textarea placeholder="산책 코스 / 장소" oninput="setPath('walkRoute',this.value)">${esc(d.walkRoute||'')}</textarea></div>`}
if(which==='water'){content=`<div class="navcard"><h3>🥤 자발 음수량</h3><div class="quickfield"><input type="number" min="0" value="${esc(d.water??'')}" oninput="setPath('water',this.value)">ml</div><p>맘마 수분량 추정: ${fmt(mealWater(d).ml)}ml</p><p class="small">자발 음수량 미측정은 빈칸으로 두세요.</p></div>`}

function navExpense(){let a=state.expenses||[];navModal('💰 반려동물 가계부',`<div class="navcard"><div class="quickfield"><input type="date" id="expDate" value="${todayKey()}"><select id="expCategory"><option>맘마</option><option>간식</option><option>약·영양제</option><option>병원</option><option>용품</option><option>기타</option></select></div><div class="quickfield"><input id="expName" placeholder="지출 내용"><input id="expAmount" type="number" min="0" placeholder="금액(원)"><button class="primary" onclick="addExpense()">저장</button></div></div><h3>지출 합계 ${a.reduce((s,x)=>s+(Number(x.amount)||0),0).toLocaleString('ko-KR')}원</h3>${a.slice().reverse().map(x=>`<div class="catalogrow"><span>${esc(x.date)} · ${esc(x.category)} · ${esc(x.name)}<br>${Number(x.amount).toLocaleString('ko-KR')}원</span><button class="mini danger" onclick="removeExpense('${escJS(x.id)}')">삭제</button></div>`).join('')||'<p class="small">아직 지출 기록이 없어요.</p>'}`)}

function navStats(){let y=current.getFullYear(),m=current.getMonth(),a=[];for(let day=1;day<=new Date(y,m+1,0).getDate();day++){let d=dayData(dateKey(y,m,day));if(Number(d.weight)>0||totalMeals(d)>0)a.push({day,weight:Number(d.weight)||null,food:totalMeals(d)||null})}let rows=a.map(x=>`<tr><td>${x.day}일</td><td>${x.weight??'–'}</td><td>${x.food??'–'}</td></tr>`).join('');let st=monthStats(y,m);navModal('📊 월간 비교',`<div class="quickfield"><button onclick="shiftMonth(-1);navStats()">‹</button><strong>${y}년 ${m+1}월</strong><button onclick="shiftMonth(1);navStats()">›</button></div><div class="navcard"><p>평균 체중: ${st.weight}kg · 평균 맘마: ${st.meal}g</p><p class="small">기록한 날짜만 평균에 포함해요.</p></div><table style="width:100%;text-align:center"><thead><tr><th>날짜</th><th>체중(kg)</th><th>맘마(g)</th></tr></thead><tbody>${rows||'<tr><td colspan="3">기록 없음</td></tr>'}</tbody></table>`)}

let swipeStart=null, suppressCalendarClickUntil=0;

document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;let t=e.target;if(t.closest('input,select,textarea,button,#sideMenu,.entry,.gb-history')){swipeStart=null;return}let inModal=!$('overlay').classList.contains('hidden');let inCalendar=!!t.closest('#calendar');if(!inModal&&!inCalendar&& !t.closest('#dailyPage')){swipeStart=null;return}swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY,modal:inModal,calendar:inCalendar,daily:!!t.closest('#dailyPage')}},{passive:true});
document.addEventListener('touchend',e=>{if(!swipeStart||e.changedTouches.length!==1)return;let dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y,was=swipeStart;swipeStart=null;if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.3)return;if(was.daily){if(dx>0)navHome();return}if(was.modal){if(dx>0)closeModal();return}if(was.calendar){suppressCalendarClickUntil=Date.now()+450;shiftMonth(dx>0?-1:1)}},{passive:true});

const compareNames={weight:'⚖️ 체중',food:'🥣 맘마',toilet:'💩 응가',walk:'🐾 산책',water:'🥤 음수량',fluid:'💉 피하수액',medicine:'💊 약 · 영양제',medical:'🏥 의료기록',expense:'💰 가계부',all:'📊 월간 비교'};
function compareRow(k,type){let d=dayData(k),u=(state.urine||{})[k]||{},exp=(state.expenses||[]).filter(x=>x.date===k);let snack=(d.snacks||[]).reduce((a,x)=>a+(Number(x.count)||0),0),fluids=(d.fluid||[]).filter(x=>x.done);let doneMeds=Object.values(d.med||{}).filter(Boolean).length,doneSupp=Object.values(d.supp||{}).filter(Boolean).length;
let data={weight:d.weight>0?d.weight+'kg':'',food:totalMeals(d)>0?totalMeals(d)+'g':'',toilet:d.poop?.length?'응가 '+d.poop.length+'회 · '+d.poop.map(x=>x.kind).join(', '):'',walk:d.walk?d.walk+'회'+(d.walkMinutes?' · '+d.walkMinutes+'분':'')+(d.walkKm?' · '+d.walkKm+'km':''):'',water:[d.water!==''&&d.water!=null?'직접 '+d.water+'ml':'',totalMeals(d)>0?'식사 추정 '+fmt(mealWater(d).ml)+'ml':''].filter(Boolean).join(' · '),fluid:fluids.length?fluids.length+'회 · '+fluids.reduce((a,x)=>a+(Number(x.ml)||0),0)+'ml':'',medicine:doneMeds||doneSupp?'약 '+doneMeds+' · 영양제 '+doneSupp:'',medical:[d.hospital?'병원':'',d.appointment?'일정':'',(gb().history||[]).some(x=>x.date===k)?'약 제조':''].filter(Boolean).join(' · '),expense:exp.length?exp.reduce((a,x)=>a+(Number(x.amount)||0),0).toLocaleString('ko-KR')+'원':''};return type==='all'?Object.entries(data).filter(([a,v])=>v).map(([a,v])=>compareNames[a].replace(/^[^ ]+ /,'')+' '+v).join(' / '):data[type]||''}
function navCompare(type){if(type==='all')return excludedMonthly();toggleMenu(false);let y=current.getFullYear(),m=current.getMonth(),n=new Date(y,m+1,0).getDate(),rows=[],vals=[];for(let i=1;i<=n;i++){let k=dateKey(y,m,i),v=compareRow(k,type);rows.push(`<tr><td>${i}일</td><td>${esc(v||'–')}</td><td><button class="mini" onclick="jumpRecord('${k}','${type}')">기록하기</button></td></tr>`);if(type==='weight'&&Number(dayData(k).weight)>0)vals.push(Number(dayData(k).weight));if(type==='food'&&totalMeals(dayData(k))>0)vals.push(totalMeals(dayData(k)))}let average=vals.length?'평균 '+(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)+(type==='weight'?'kg':'g'):'';let total=type==='expense'?(state.expenses||[]).filter(x=>x.date?.startsWith(`${y}-${String(m+1).padStart(2,'0')}-`)).reduce((a,x)=>a+Number(x.amount||0),0).toLocaleString('ko-KR')+'원':'';navModal((compareNames[type]||'📊 월간 비교')+' · 월간 비교',`<div class="quickfield"><button onclick="shiftMonth(-1);navCompare('${type}')">‹</button><strong>${y}년 ${m+1}월</strong><button onclick="shiftMonth(1);navCompare('${type}')">›</button></div><div class="navcard"><strong>기록 ${Array.from({length:n},(_,i)=>compareRow(dateKey(y,m,i+1),type)).filter(Boolean).length}일 ${average?' · '+average:''} ${total?' · 총 '+total:''}</strong><p class="small">달력에 기록된 내용만 표시해요. 빈 날은 0으로 계산하지 않아요.</p></div>${recordGraphs(type,y,m,n)}<div class="navcard" style="overflow:auto;max-height:48vh;overscroll-behavior:contain;touch-action:pan-y"><table style="width:100%;text-align:left;border-spacing:8px"><thead><tr><th>날짜</th><th>기록</th><th></th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="3">이 달의 기록이 없어요.</td></tr>'}</tbody></table></div><button class="primary" onclick="jumpRecord(todayKey(),'${type}')">오늘 기록하기</button>`)}

function waterSummary(d){let m=mealWater(d),known=d.water!==''&&d.water!=null, total=m.ml+(known?Number(d.water)||0:0);return '식사 수분 약 '+fmt(m.ml)+'ml'+(m.unknown.length?' (일부 함량 미등록)':'')+' · 자발 음수 '+(known?fmt(Number(d.water))+'ml':'미측정')+'<br><b>총 수분량 '+fmt(total)+'ml'+(!known||m.unknown.length?' (확인된 양만)':'')+'</b>'}
